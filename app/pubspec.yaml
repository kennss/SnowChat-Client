name: snowchat
description: E2EE Messenger
publish_to: 'none'
version: 1.0.0+1007

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter

  # Client-side zkgroup for group protocol v2 (anonymous credentials). A
  # first-party Rust crate over libsignal's zkgroup, built from source by a
  # build hook — building the app needs rustup and protoc.
  snowchat_zkgroup:
    path: ../packages/snowchat_zkgroup

  # State management
  flutter_riverpod: ^2.5.0
  riverpod_annotation: ^2.3.0

  # Routing
  go_router: ^14.0.0

  # Network
  dio: ^5.4.0
  socket_io_client: ^2.0.3

  # Local DB
  drift: ^2.16.0
  # At-rest encryption (2026-11-11): SQLCipher replaces the stock sqlite3
  # native library for the drift DB. 0.6.x is the last line compatible with
  # package:sqlite3 2.x (drift < 2.32); the package is EOL upstream — the
  # successor is drift >= 2.32 + sqlite3 3.x with the sqlite3mc build hook,
  # which needs the analyzer / codegen stack upgraded first. SQLCipher files
  # stay readable by sqlite3mc (cipher=sqlcipher, legacy=4), so no data reset.
  sqlcipher_flutter_libs: ^0.6.8
  sqlite3: ^2.9.4   # direct import of open.dart (SQLCipher library override)

  # Secure storage
  flutter_secure_storage: ^9.0.0

  # Biometric auth
  local_auth: ^2.2.0

  # Identity keys: BIP39 recovery phrase -> SLIP-0010 Ed25519 (key_derivation.dart).
  # ed25519_hd_key is pinned exactly: a change in its derivation would restore a
  # different account from the same phrase (key_derivation_golden_test.dart).
  bip39: ^1.0.6
  ed25519_hd_key: 2.3.0
  pinenacl: ^0.6.0

  # Hash (Safety Number SHA-512 iteration; transitive via flutter SDK already)
  crypto: ^3.0.0

  # QR code: my QR / friend QR scan, community invite QR, Safety Number QR
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.2.0  # Flutter ≥3.29 OK (Spike S7)

  # Deeplink (snowchat:// invite links — Phase 1, Phase 2 = Universal/App Link)
  app_links: ^6.3.2

  # UI
  shimmer: ^3.0.0
  flutter_slidable: ^3.0.0
  cupertino_icons: ^1.0.8

  # Push / Local Notifications
  flutter_local_notifications: ^18.0.0
  firebase_core: ^3.0.0
  firebase_messaging: ^15.0.0
  # App icon badge (Samsung One UI + Sony + Huawei + Apex launcher; iOS reads
  # aps.badge from APNs payload). Pixel/AOSP shows notification dot via
  # channel.showBadge, so we don't drive this plugin for Pixel — the dot path
  # covers it. flutter_app_badger 1.5.0 was the first pick but it's missing
  # the AGP 8 namespace declaration → assembleRelease fails. app_badge_plus
  # is the actively-maintained fork that declares namespace cleanly.
  app_badge_plus: ^1.1.2

  # Voice Messages
  # record 5.0.5 was disabled in 2026 due to record_linux incompatibility.
  # 6.x line declares platforms cleanly (iOS/Android/macOS/Windows/Web) so
  # the linux failure mode is gone — re-enabled 2026-05-11 to back the voice
  # message UI wiring (input-bar long-press → VoiceRecorder overlay).
  record: ^6.2.0
  audioplayers: ^6.0.0

  # HTTP
  http: ^1.2.0

  # Util
  freezed_annotation: ^2.4.0
  json_annotation: ^4.8.0
  path_provider: ^2.1.0
  path: ^1.9.1                    # path joins (was used transitively; storage layer imports it directly)
  share_plus: ^12.0.1          # 2026-05-11: 7.x → 12.x. iOS 26 iPhone share sheet silent fail
                               # (sharePositionOrigin 누락 시 no-op) 회피 — fix landed in 12.0.1.
                               # SharePlus.instance.share(ShareParams(...)) API 로 마이그레이션 (3 call site).
                               # 13.x 는 win32 ^6.0 요구 → device_info_plus 12.4 (win32 ^5.11) 와 충돌.
  url_launcher: ^6.2.0
  uuid: ^4.2.0
  convert: ^3.1.1
  image_picker: ^1.1.0
  file_picker: ^8.1.0
  flutter_image_compress: ^2.3.0
  open_filex: ^4.5.0
  # PDF viewer (Apache-2.0, native PDFKit/PdfRenderer wrapper) — added 2026-05-11
  # for in-app disappearing PDF viewing. Routing files through OpenFilex to
  # external apps exposes Save/Share outside our control; pdfx renders inside
  # our process so the disappearing TTL promise is preserved.
  pdfx: ^2.9.2
  connectivity_plus: ^7.1.1
  background_downloader: ^8.6.0
  permission_handler: ^12.0.1
  photo_manager: ^3.9.0
  battery_plus: ^7.0.0
  device_info_plus: ^12.4.0
  package_info_plus: ^8.0.0       # Phase 8.2 Path B v4 (C2) — read pubspec buildNumber for callHandler PATHB_MIN_CLIENT_VERSION gate
  device_calendar: ^4.3.1

  # Phase 8.2 VoIP — WebRTC P2P + CallKit/ConnectionService + Cloudflare TURN
  flutter_webrtc: ^1.4.1           # WebRTC Peer-to-Peer (Spike 검증 완료: iOS 26 + Android 16)
  audio_session: ^0.2.0            # iOS/Android 오디오 세션 관리 (voiceChat 모드)
  vibration: ^3.0.0                # 수신 벨 진동
  # flutter_callkit_incoming — fork with self-managed Telecom ConnectionService
  # 실제 구현. upstream 은 PhoneAccount 등록만 하고 addNewIncomingCall + Connection
  # overrides 가 전부 stub. Samsung Knox 같은 OEM keyguard bypass 목적으로 필요.
  # fork 위치: ../external/flutter_callkit_incoming (PR 준비 후 upstream 반영 목표).
  flutter_callkit_incoming:
    path: ../external/flutter_callkit_incoming
  # iOS PushKit은 네이티브 Swift 직접 통합 (Phase E). pub.dev에 안정 패키지 부재 — MethodChannel 패턴.
  screen_protector: ^1.5.1         # Android FLAG_SECURE + iOS 백그라운드 스냅샷 차단 (flutter_windowmanager 대체 — namespace 이슈로 폐기)

  # On-device translation is native on both platforms (no Flutter plugin):
  # Android = ML Kit Gradle deps in TranslationBridge.kt, iOS = Apple
  # Translation in TranslationBridge.swift. The google_mlkit_* plugins were
  # removed 2026-11-11 because they linked the GoogleMLKit pods into iOS.


dev_dependencies:
  flutter_test:
    sdk: flutter
  # On-device runs of the real app stack (integration_test/): the group
  # protocol v2 round trip between two emulators.
  integration_test:
    sdk: flutter
  # Timer-driven tests (call ring timeouts) — the version flutter_test pins.
  fake_async: ^1.3.3
  flutter_lints: ^6.0.0
  build_runner: ^2.4.0
  freezed: ^2.4.0
  json_serializable: ^6.7.0
  riverpod_generator: ^2.3.0
  drift_dev: ^2.16.0
  mockito: ^5.4.0
  flutter_launcher_icons: ^0.14.4

# Snowchat 앱 아이콘 — Snowchat.ico/png/snowchat-1024.png 소스로 iOS+Android 일괄 생성
# 실행: dart run flutter_launcher_icons
flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  remove_alpha_ios: true  # iOS 는 알파 채널 거부 (App Store 검증 실패 방지)
  image_path: "../Snowchat.ico/png/snowchat-1024.png"
  min_sdk_android: 23
  background_color_ios: "#000000"

flutter:
  uses-material-design: true
  # Phase J (Phase 8.2 §26): VoIP ringback / busy tone 에셋 (sine wave 합성, 라이선스 무관)
  assets:
    - assets/audio/
